services:
  minio:
    image: localstack/localstack:4.14.0
    ports:
      - "9000:4566"   # S3 API
      - "4510-4559:4510-4559"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      SERVICES: s3
    volumes:
      - minio_data:/data

volumes:
  minio_data: